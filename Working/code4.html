<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            resize: none;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <h2>Live Character Counter</h2>
    <textarea id="textInput" placeholder="Start typing here..."></textarea>
    <div class="stats">
        <span>Characters: <span id="charCount">0</span></span>
    </div>
    <script>
        let input = document.querySelector('#textInput')
        let count = document.querySelector('#charCount')

        input.addEventListener('input',function() {
            count.textContent = input.value.length;
        })
        
    </script>
</body>
</html>
