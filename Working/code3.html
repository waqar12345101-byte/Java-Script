<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        #count {
            font-size: 5rem;
            margin: 20px 0;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #decrease { background-color: #ff4d4d; color: white; border: none; }
        #reset { background-color: #6c757d; color: white; border: none; }
        #increase { background-color: #28a745; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Counter</h1>
    <div id="count">0</div>
    <div>
        <button id="decrease">Decrease</button>
        <button id="reset">Reset</button>
        <button id="increase">Increase</button>
    </div>

    <script>
        let decrease = document.querySelector('#decrease')
        let reset = document.querySelector('#reset')
        let increase = document.querySelector('#increase')
        let counter = document.querySelector('#count')
        
        let count = 0 ;

        decrease.addEventListener('click',function(d) {
            d.preventDefault();
            count--;
            counter.innerHTML = `<span>${count}</span>`
        })

        reset.addEventListener('click',function(r) {
            r.preventDefault();
            count = 0 ;
            counter.innerHTML = `<span>${count}</span>`
        })

        increase.addEventListener('click',function(i) {
            i.preventDefault();
            count++;
            counter.innerHTML = `<span>${count}</span>`
        })
    </script>
</body>
</html>
